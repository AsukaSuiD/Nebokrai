[workspace]
members = ["."]
resolver = "3"

[package]
name = "miracle-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "authserver"
path = "src/bin/authserver.rs"

[[bin]]
name = "billingserver"
path = "src/bin/billingserver.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.0"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
freetype-rs = { version = "0.38.0", features = ["bundled"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
md-5 = "0.11.0"
lzo = "0.1.3"
parking_lot = "0.12.5"
procfs = { version = "0.18.0", default-features = false }
quick-xml = "0.39.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
rustix = { version = "1.1.4", features = ["system", "time"] }
socket2 = "0.6.5"
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "tds73"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
uuid = "1.24.0"
walkdir = "2.5.0"
