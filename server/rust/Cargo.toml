[workspace]
members = ["."]
resolver = "3"

[package]
name = "nebokrai-server"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[[bin]]
name = "authserver"
path = "src/bin/authserver.rs"

[[bin]]
name = "billingserver"
path = "src/bin/billingserver.rs"

[[bin]]
name = "gameserver"
path = "src/bin/gameserver.rs"

[[bin]]
name = "loginserver"
path = "src/bin/loginserver.rs"

[[bin]]
name = "miscserver"
path = "src/bin/miscserver.rs"

[[bin]]
name = "worldserver"
path = "src/bin/worldserver.rs"

[dependencies]
bitflags = "2.13.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
crc32fast = "1.5.0"
encoding_rs = "0.8.35"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
freetype-rs = { version = "0.38.0", features = ["bundled"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
indexmap = "2.14.0"
libc = "0.2.180"
md-5 = "0.11.0"
nom = "8.0.0"
lzo = "0.1.3"
parking_lot = "0.12.5"
procfs = { version = "0.18.0", default-features = false }
quick-xml = "0.39.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
rustix = { version = "1.1.4", features = ["system", "time"] }
socket2 = "0.6.5"
slotmap = "1.1.1"
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "tds73"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
tracing = "0.1.44"
thiserror = "2.0.20"
uuid = "1.24.0"
walkdir = "2.5.0"
zerocopy = { version = "0.8.56", features = ["derive"] }
