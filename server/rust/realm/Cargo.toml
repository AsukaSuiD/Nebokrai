[package]
name = "nebokrai-realm"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false

[dependencies]
nebokrai-shared = { path = "../shared" }
parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["macros", "net"] }
walkdir = "2.5.0"
tracing = "0.1.44"
encoding_rs = "0.8.35"
freetype-rs = { version = "0.38.0", features = ["bundled"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
thiserror = "2.0.20"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
tiberius = { version = "0.12.3", default-features = false, features = ["chrono", "tds73"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tokio-util = { version = "0.7.16", features = ["compat"] }
