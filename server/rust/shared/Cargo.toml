[package]
name = "nebokrai-shared"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false

[dependencies]
bytes = { workspace = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
quick-xml = "0.39.2"
zerocopy = { version = "0.8.56", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
lzo = "0.1.3"
crc32fast = "1.5.0"
md-5 = "0.11.0"
parking_lot = "0.12.5"
socket2 = "0.6.5"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt-multi-thread", "time"] }
getrandom = { workspace = true }
nom = "8.0.0"
uuid = { workspace = true }
